<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>True Net Calculator: Cross-Border Invoice Fee, FX and Tax Calculator</title>
<meta name="description" content="Free fee calculator for freelancers and global businesses. Instantly calculate real net earnings after Stripe, PayPal, Wise, and SWIFT currency conversion fees."/>
</head>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM 18 UMD Production -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fcfbf9;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ============================================================================
    // CONFIGURATION: checkout & product details
    // ============================================================================
    const CHECKOUT_URL = "https://buy.polar.sh/polar_cl_HxAWxP8gg7um1nME6OeblxiEQoF1j3ZDLSTi20NOcdQ";
    const LEMONSQUEEZY_STORE_ID = "";
    const LEMONSQUEEZY_PRODUCT_ID = "";
    const LIFETIME_PASS_PRICE = "$49";
    const SUPPORT_EMAIL = "devthinktoomuch@gmail.com";
    const OPERATOR_NAME = "";
    const REFUND_DAYS = 14;

    // ============================================================================
    // SHARED CONSTANTS, FEE MATH AND INPUT SANITIZERS
    // ============================================================================
    const FX_RATES = {
      USD: { USD: 1.0, EUR: 0.92, GBP: 0.79 },
      EUR: { USD: 1.087, EUR: 1.0, GBP: 0.859 },
      GBP: { USD: 1.266, EUR: 1.164, GBP: 1.0 },
    };
    const CURRENCIES = ['USD', 'EUR', 'GBP'];
    const SYMBOLS = { USD: '$', EUR: '€', GBP: '£' };

    const GATEWAYS = {
      stripe: {
        id: 'stripe',
        name: 'Stripe',
        label: 'Stripe (2.9% + $0.30 Base / ~4.4%–5.4% Cross-Border & FX)',
        baseRate: 0.029,
        fixedFeeUsd: 0.3,
        crossBorderRate: 0.015,
        intermediaryUsd: 0,
        fxRate: 0.01,
      },
      paypal: {
        id: 'paypal',
        name: 'PayPal',
        label: "PayPal (3.49% + $0.49 Base / ~7.5%+ Int'l & FX Markup)",
        baseRate: 0.0349,
        fixedFeeUsd: 0.49,
        crossBorderRate: 0.015,
        intermediaryUsd: 0,
        fxRate: 0.035,
      },
      wise: {
        id: 'wise',
        name: 'Wise Business',
        label: 'Wise Business (~0.45%–0.6% + Mid-Market FX)',
        baseRate: 0.0045,
        fixedFeeUsd: 0,
        crossBorderRate: 0,
        intermediaryUsd: 0,
        fxRate: 0,
      },
      swift: {
        id: 'swift',
        name: 'SWIFT Bank Wire',
        label: 'SWIFT Bank Wire ($45 Flat + Intermediary & FX Spread)',
        baseRate: 0,
        fixedFeeUsd: 45,
        crossBorderRate: 0,
        intermediaryUsd: 20,
        fxRate: 0.025,
      },
    };
    const GATEWAY_KEYS = Object.keys(GATEWAYS);

    const MAX_GROSS = 1_000_000_000;
    const MAX_TAX = 50;
    const WISE_AFFILIATE_URL = '';

    const SITE_TITLE = 'True Net Calculator: Cross-Border Invoice Fee, FX and Tax Calculator';
    const DEFAULTS = { gross: '12500', invoiceCurrency: 'USD', targetCurrency: 'EUR', gateway: 'stripe', tax: 25 };
    const STORAGE_KEYS = {
      gross: 'true_net_calculator_gross',
      invoiceCurrency: 'true_net_calculator_inv_cur',
      targetCurrency: 'true_net_calculator_tgt_cur',
      gateway: 'true_net_calculator_gateway',
      tax: 'true_net_calculator_tax',
    };

    const roundCents = (v) => {
      const n = Number(v);
      if (!Number.isFinite(n)) return 0;
      const shifted = Number(`${Math.round(Number(`${n}e2`))}e-2`);
      return Number.isFinite(shifted) ? shifted : Math.round(n * 100) / 100;
    };

    const toAmount = (raw) => {
      const n = parseFloat(raw);
      return Number.isFinite(n) ? roundCents(Math.min(Math.max(n, 0), MAX_GROSS)) : 0;
    };
    const toTaxRate = (raw) => {
      const n = Number(raw);
      return Number.isFinite(n) ? Math.min(MAX_TAX, Math.max(0, Math.round(n))) : DEFAULTS.tax;
    };
    const toCurrency = (raw, fallback) => (CURRENCIES.includes(raw) ? raw : fallback);
    const toGateway = (raw) => (GATEWAY_KEYS.includes(raw) ? raw : DEFAULTS.gateway);

    const cleanAmount = (v) => {
      if (typeof v !== 'string' || v.includes('-')) return '';
      const [whole = '', ...rest] = v.replace(/[^0-9.]/g, '').split('.');
      return (rest.length ? `${whole}.${rest.join('').slice(0, 2)}` : whole).slice(0, 15);
    };

    const money = (val, code) =>
      `${SYMBOLS[code] || ''}${(Number.isFinite(val) ? val : 0).toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      })}`;
    const pct = (r) => `${(r * 100).toFixed(2)}%`;

    const CONVERT_USD_FLAT_FEES = true;
    const usdTo = (usd, currency) => (CONVERT_USD_FLAT_FEES ? roundCents(usd * (FX_RATES.USD[currency] ?? 1)) : usd);

    const computeFees = (gross, gw, isCross, invoiceCurrency = 'USD') => {
      const base = roundCents(gross * gw.baseRate);
      const crossBorder = isCross ? roundCents(gross * gw.crossBorderRate) : 0;
      const fx = isCross ? roundCents(gross * gw.fxRate) : 0;
      const percentageFees = roundCents(roundCents(base + crossBorder) + fx);

      const fixed = gross > 0 ? usdTo(gw.fixedFeeUsd, invoiceCurrency) : 0;
      const intermediary = isCross && gross > 0 ? usdTo(gw.intermediaryUsd, invoiceCurrency) : 0;
      const flatFees = roundCents(fixed + intermediary);

      const raw = roundCents(percentageFees + flatFees);
      const total = Math.min(gross, raw);
      return { base, crossBorder, fx, percentageFees, fixed, intermediary, flatFees, total, afterFees: roundCents(gross - total), capped: raw > gross };
    };

    const calculatePayout = ({ gross, gateway, invoiceCurrency, targetCurrency, taxRate }) => {
      const gw = GATEWAYS[toGateway(gateway)];
      const amount = toAmount(gross);
      const tax = toTaxRate(taxRate);
      const isCross = invoiceCurrency !== targetCurrency;
      const fees = computeFees(amount, gw, isCross, invoiceCurrency);
      const crossRate = FX_RATES[invoiceCurrency]?.[targetCurrency] ?? 1.0;
      const converted = roundCents(fees.afterFees * crossRate);
      const taxReserve = roundCents(converted * (tax / 100));
      const net = roundCents(converted - taxReserve);
      const wiseTotal = computeFees(amount, GATEWAYS.wise, isCross, invoiceCurrency).total;
      const leakage = roundCents(Math.max(0, roundCents(fees.total - wiseTotal)) * crossRate);
      const effectiveRate = amount > 0 ? roundCents((fees.total / amount) * 100) : 0;
      return { gw, amount, tax, isCross, fees, crossRate, converted, taxReserve, net, leakage, effectiveRate };
    };

    const seeded = (seed) => {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    };
    const simulateFxSeries = (from, to, days = 30) => {
      const base = FX_RATES[from]?.[to] ?? 1;
      if (from === to) return Array.from({ length: days }, () => 1);
      const rand = seeded([...`${from}${to}`].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7));
      let w = 1;
      const walk = Array.from({ length: days }, () => (w *= 1 + (rand() - 0.5) * 0.012));
      return walk.map((v) => (v / walk[days - 1]) * base);
    };

    // ============================================================================
    // LICENSE CLIENT
    // ============================================================================
    const LICENSE_CONFIG = {
      priceLabel: LIFETIME_PASS_PRICE,
      priceNote: 'One-time payment. Lifetime access.',
    };

    const API = 'https://api.lemonsqueezy.com/v1/licenses';
    const REQUEST_TIMEOUT_MS = 10000;
    const KEY_PATTERN = /^[A-Za-z0-9-]{8,64}$/;
    const LICENSE_STORAGE_KEY = 'true_net_calculator_license';

    const fail = (message) => ({ ok: false, message });

    const checkoutHref = () => {
      try {
        const url = new URL(CHECKOUT_URL);
        return url.protocol === 'https:' ? url.href : '';
      } catch {
        return '';
      }
    };

    const normalizeKey = (raw) => (typeof raw === 'string' ? raw.trim() : '');
    const isValidKeyFormat = (key) => KEY_PATTERN.test(key);

    const post = async (path, fields) => {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
      try {
        const res = await fetch(`${API}/${path}`, {
          method: 'POST',
          headers: { Accept: 'application/json', 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(fields).toString(),
          signal: controller.signal,
        });
        let data = null;
        try {
          data = await res.json();
        } catch {
          data = null;
        }
        return { ok: res.ok, data };
      } finally {
        clearTimeout(timer);
      }
    };

    const belongsToThisProduct = (meta) => {
      if (String(LEMONSQUEEZY_STORE_ID).trim() && String(meta?.store_id) !== String(LEMONSQUEEZY_STORE_ID).trim()) return false;
      if (String(LEMONSQUEEZY_PRODUCT_ID).trim() && String(meta?.product_id) !== String(LEMONSQUEEZY_PRODUCT_ID).trim()) return false;
      return true;
    };

    const takeLicenseKeyFromUrl = (search) => {
      const params = new URLSearchParams(search);
      const raw = params.get('license_key');
      if (raw === null) return { key: '', search };
      params.delete('license_key');
      const query = params.toString();
      return { key: normalizeKey(raw), search: query ? `?${query}` : '' };
    };

    async function activateLicense(rawKey) {
      const key = normalizeKey(rawKey);
      if (!isValidKeyFormat(key)) return fail('That does not look like a license key. Copy it from your purchase email.');
      try {
        const { data } = await post('activate', { license_key: key, instance_name: 'TrueNetWeb' });
        if (!data || data.activated !== true) {
          return fail(typeof data?.error === 'string' && data.error ? data.error.slice(0, 200) : 'Invalid or expired license key.');
        }
        if (!belongsToThisProduct(data.meta)) {
          if (data.instance?.id) {
            try {
              await post('deactivate', { license_key: key, instance_id: String(data.instance.id) });
            } catch {
              // Best effort: free the slot we just used
            }
          }
          return fail('That license key belongs to a different store or product.');
        }
        const instanceId = String(data.instance?.id ?? '');
        if (!KEY_PATTERN.test(instanceId)) return fail('The license server sent an unexpected response.');
        return { ok: true, license: { key, instanceId } };
      } catch {
        return fail('Could not reach the license server. Check your connection and try again.');
      }
    }

    async function validateLicense({ key, instanceId }) {
      try {
        const { data } = await post('validate', { license_key: key, instance_id: instanceId });
        if (data && data.valid === true) return belongsToThisProduct(data.meta) ? 'valid' : 'invalid';
        if (data && data.valid === false) return 'invalid';
        return 'unknown';
      } catch {
        return 'unknown';
      }
    }

    async function deactivateLicense({ key, instanceId }) {
      try {
        const { data } = await post('deactivate', { license_key: key, instance_id: instanceId });
        return data?.deactivated === true;
      } catch {
        return false;
      }
    }

    function loadStoredLicense() {
      try {
        const parsed = JSON.parse(localStorage.getItem(LICENSE_STORAGE_KEY) || 'null');
        if (!parsed || typeof parsed !== 'object') return null;
        const { key, instanceId } = parsed;
        if (typeof key !== 'string' || typeof instanceId !== 'string') return null;
        if (!KEY_PATTERN.test(key) || !KEY_PATTERN.test(instanceId)) return null;
        return { key, instanceId };
      } catch {
        return null;
      }
    }

    function saveStoredLicense(license) {
      try {
        localStorage.setItem(LICENSE_STORAGE_KEY, JSON.stringify({ key: license.key, instanceId: license.instanceId }));
      } catch {
        // Storage blocked: license lasts for this session only
      }
    }

    function clearStoredLicense() {
      try {
        localStorage.removeItem(LICENSE_STORAGE_KEY);
      } catch {
        // Nothing to clear
      }
    }

    // ============================================================================
    // GOOGLE ADSENSE SLOTS
    // ============================================================================
    const CLIENT = '';
    const SLOTS = {
      top: '',
      infeed: '',
      footer: '',
    };
    const CLIENT_OK = /^ca-pub-\d{10,20}$/.test(CLIENT);
    const SLOT_OK = (id) => /^\d{6,20}$/.test(id);

    const ADS_CONFIGURED = CLIENT_OK && Object.values(SLOTS).some(SLOT_OK);

    const CONSENT_KEY = 'true_net_calculator_ads_consent';
    const CONSENT_EVENT = 'true-net-calculator-ads-consent';
    const readConsent = () => {
      try {
        return localStorage.getItem(CONSENT_KEY);
      } catch {
        return null;
      }
    };

    let scriptPromise = null;
    function loadAdScript() {
      if (scriptPromise) return scriptPromise;
      scriptPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.async = true;
        script.crossOrigin = 'anonymous';
        script.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${encodeURIComponent(CLIENT)}`;
        script.onload = () => resolve();
        script.onerror = () => {
          scriptPromise = null;
          reject(new Error('ad script blocked'));
        };
        document.head.appendChild(script);
      });
      return scriptPromise;
    }

    function AdConsentBar({ hidden }) {
      const [choice, setChoice] = useState('pending');
      useEffect(() => {
        setChoice(readConsent() || 'unset');
      }, []);
      if (hidden || !ADS_CONFIGURED || choice !== 'unset') return null;
      const answer = (value) => {
        try {
          localStorage.setItem(CONSENT_KEY, value);
        } catch {
          // Storage blocked
        }
        setChoice(value);
        window.dispatchEvent(new Event(CONSENT_EVENT));
      };
      return (
        <div role="region" aria-label="Ad preferences" className="mx-auto mt-4 flex max-w-5xl flex-col gap-3 rounded-xl border border-slate-200 bg-white/90 px-4 py-3 text-xs text-slate-700 sm:flex-row sm:items-center sm:justify-between">
          <p>The free plan shows a few Google ads, which may use cookies. Allow them? The Lifetime Pass removes ads. <a href="#privacy" className="underline underline-offset-2">Privacy Policy</a></p>
          <div className="flex shrink-0 gap-2">
            <button type="button" onClick={() => answer('granted')} className="rounded-lg bg-slate-900 px-3 py-1.5 font-semibold text-white hover:bg-slate-800">Allow ads</button>
            <button type="button" onClick={() => answer('denied')} className="rounded-lg border border-slate-300 bg-white px-3 py-1.5 font-semibold text-slate-700 hover:bg-slate-50">No thanks</button>
          </div>
        </div>
      );
    }

    function AdBanner({ slot, hidden, className = '' }) {
      const slotId = SLOTS[slot] || '';
      const enabled = CLIENT_OK && SLOT_OK(slotId) && !hidden;
      const [state, setState] = useState('off');
      const insRef = useRef(null);

      useEffect(() => {
        if (!enabled) {
          setState('off');
          return undefined;
        }
        const sync = () => setState((s) => (readConsent() === 'granted' && s === 'off' ? 'ready' : s));
        sync();
        window.addEventListener(CONSENT_EVENT, sync);
        return () => window.removeEventListener(CONSENT_EVENT, sync);
      }, [enabled]);

      useEffect(() => {
        if (state !== 'ready') return undefined;
        let cancelled = false;
        loadAdScript()
          .then(() => {
            if (cancelled) return;
            try {
              (window.adsbygoogle = window.adsbygoogle || []).push({});
              setState('live');
            } catch {
              setState('blocked');
            }
          })
          .catch(() => {
            if (!cancelled) setState('blocked');
          });
        return () => {
          cancelled = true;
        };
      }, [state]);

      useEffect(() => {
        const el = insRef.current;
        if (state !== 'live' || !el) return undefined;
        const observer = new MutationObserver(() => {
          if (el.getAttribute('data-ad-status') === 'unfilled') setState('blocked');
        });
        observer.observe(el, { attributes: true, attributeFilter: ['data-ad-status'] });
        return () => observer.disconnect();
      }, [state]);

      if (!enabled || (state !== 'ready' && state !== 'live')) return null;
      return (
        <aside aria-label="Advertisement" className={`mx-auto w-full max-w-5xl px-4 sm:px-6 ${className}`}>
          <p className="mb-1 text-center text-[10px] uppercase tracking-widest text-slate-400">Advertisement</p>
          <ins
            ref={insRef}
            className="adsbygoogle block min-h-[90px] w-full overflow-hidden rounded-lg"
            style={{ display: 'block' }}
            data-ad-client={CLIENT}
            data-ad-slot={slotId}
            data-ad-format="auto"
            data-full-width-responsive="true"
          />
        </aside>
      );
    }

    // ============================================================================
    // PREMIUM MODULES AND ACTIVATION SCREEN
    // ============================================================================
    const PROFILES_KEY = 'true_net_calculator_saved_clients';
    const LEDGER_KEY = 'true_net_calculator_ledger';
    const MAX_PROFILES = 20;
    const MAX_LEDGER = 200;

    const panel = 'rounded-2xl border border-slate-200 bg-white/80 shadow-sm';
    const field =
      'w-full min-w-0 rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900';
    const btnPrimary =
      'rounded-xl bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50';
    const btnQuiet =
      'rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900';

    const newId = () => `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
    const cleanText = (s, max = 40) => String(s ?? '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, max);
    const today = () => new Date().toISOString().slice(0, 10);

    const csvCell = (v) => {
      let s = String(v ?? '');
      if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`;
      return `"${s.replace(/"/g, '""')}"`;
    };

    const sanitizeProfile = (p) => {
      if (!p || typeof p !== 'object') return null;
      const name = cleanText(p.name);
      if (!name) return null;
      return {
        id: cleanText(p.id) || newId(),
        name,
        invoiceCurrency: toCurrency(p.invoiceCurrency, 'USD'),
        targetCurrency: toCurrency(p.targetCurrency, 'EUR'),
        gateway: toGateway(p.gateway),
        tax: toTaxRate(p.tax),
      };
    };

    const sanitizeEntry = (e) => {
      if (!e || typeof e !== 'object') return null;
      return {
        id: cleanText(e.id) || newId(),
        date: /^\d{4}-\d{2}-\d{2}$/.test(String(e.date)) ? e.date : today(),
        label: cleanText(e.label),
        gross: toAmount(e.gross),
        invoiceCurrency: toCurrency(e.invoiceCurrency, 'USD'),
        targetCurrency: toCurrency(e.targetCurrency, 'EUR'),
        gateway: toGateway(e.gateway),
        tax: toTaxRate(e.tax),
      };
    };

    function useStoredList(key, sanitize, max) {
      const [items, setItems] = useState([]);
      const [ready, setReady] = useState(false);
      useEffect(() => {
        try {
          const raw = JSON.parse(localStorage.getItem(key) || '[]');
          if (Array.isArray(raw)) setItems(raw.map(sanitize).filter(Boolean).slice(0, max));
        } catch {
          // Corrupt data is ignored
        }
        setReady(true);
      }, [key, sanitize, max]);
      useEffect(() => {
        if (!ready) return;
        try {
          localStorage.setItem(key, JSON.stringify(items));
        } catch {
          // Storage full or blocked
        }
      }, [items, ready, key]);
      return [items, setItems];
    }

    const PREVIEW_CARDS = [
      ['Saved Client Profiles', 'Save currencies, processor and tax rate per client and reload them in one tap.'],
      ['Invoice Ledger and Accountant Report', 'Log invoices on this device and download a cent-accurate CSV for your accountant.'],
      ['Provider Savings and Annual Projection', 'Compare Stripe, PayPal, Wise and SWIFT on your invoice and see what switching saves each year.'],
      ['FX Trend Visualizer and Rate Alerts', 'See a 30-day simulated rate line and get alerts when it moves past your threshold.'],
    ];

    function PaywallCard({ busy, message, messageIsError, onActivate }) {
      const [keyInput, setKeyInput] = useState('');
      const href = checkoutHref();
      return (
        <div className="w-full max-w-md space-y-5 rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-2xl sm:p-7">
          <div>
            <p className="text-xs font-bold uppercase tracking-widest text-slate-400">
              <span aria-hidden="true">🔒 </span>Premium is locked
            </p>
            <h2 className="mt-1 text-xl font-extrabold">True Net Calculator Lifetime Pass</h2>
            <p className="mt-2 text-3xl font-black tabular-nums">{LICENSE_CONFIG.priceLabel}</p>
            <p className="text-sm text-slate-600">{LICENSE_CONFIG.priceNote}</p>
          </div>
          <ul className="space-y-1.5 text-left text-sm text-slate-700">
            {['Saved client profiles', 'Invoice ledger and accountant report (CSV)', 'Provider savings and annual projection', 'FX trend visualizer with rate alerts'].map((t) => (
              <li key={t} className="flex items-center gap-2">
                <span aria-hidden="true" className="text-emerald-700">✓</span>
                {t}
              </li>
            ))}
          </ul>
          <div>
            {href ? (
              <a href={href} target="_blank" rel="noopener noreferrer" className={`${btnPrimary} inline-block w-full`}>Claim Lifetime Pass</a>
            ) : (
              <button type="button" disabled className={`${btnPrimary} w-full`}>Claim Lifetime Pass</button>
            )}
            <p className="mt-2 text-xs text-slate-500">
              {href
                ? 'Secure checkout. VAT or sales tax is added at checkout where it applies.'
                : 'Checkout is not connected yet.'}
            </p>
            <p className="mt-1 text-xs text-slate-500">
              By purchasing you agree to the <a href="#terms" className="underline underline-offset-2">Terms &amp; Disclaimer</a> and <a href="#privacy" className="underline underline-offset-2">Privacy Policy</a>.
            </p>
          </div>
          <form
            className="border-t border-slate-200 pt-5 text-left"
            onSubmit={(e) => {
              e.preventDefault();
              onActivate(keyInput);
            }}
          >
            <label htmlFor="licenseKey" className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Already purchased? Enter License Key</label>
            <div className="flex flex-col gap-2 min-[420px]:flex-row">
              <input
                id="licenseKey"
                className={`${field} font-mono`}
                value={keyInput}
                maxLength={64}
                autoComplete="off"
                spellCheck={false}
                placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                onChange={(e) => setKeyInput(e.target.value)}
              />
              <button type="submit" className={btnPrimary} disabled={busy || !keyInput.trim()}>{busy ? 'Checking...' : 'Activate'}</button>
            </div>
          </form>
          <p role="status" aria-live="polite" className={`min-h-[1.25rem] text-xs ${messageIsError ? 'font-semibold text-red-700' : 'text-emerald-800'}`}>{message}</p>
        </div>
      );
    }

    const entryCalc = (e) =>
      calculatePayout({ gross: e.gross, gateway: e.gateway, invoiceCurrency: e.invoiceCurrency, targetCurrency: e.targetCurrency, taxRate: e.tax });

    const buildLedgerCsv = (ledger) => {
      const head = [
        'Date', 'Client or note', 'Gross (client currency)', 'Client currency', 'Payout currency', 'Processor',
        'Base fee (client currency)', 'Cross-border surcharge (client currency)', 'FX spread cost (client currency)',
        'Fixed fees (client currency)', 'Total fees (client currency)', 'Converted payout (payout currency)',
        'Tax set-aside %', 'Tax reserve (payout currency)', 'Net kept (payout currency)',
      ];
      const rows = ledger.map((e) => {
        const c = entryCalc(e);
        const f = c.fees;
        return [
          e.date, e.label, c.amount.toFixed(2), e.invoiceCurrency, e.targetCurrency, GATEWAYS[e.gateway].name,
          f.base.toFixed(2), f.crossBorder.toFixed(2), f.fx.toFixed(2), f.flatFees.toFixed(2), f.total.toFixed(2),
          c.converted.toFixed(2), c.tax, c.taxReserve.toFixed(2), c.net.toFixed(2),
        ];
      });
      return `\uFEFF${[head, ...rows].map((r) => r.map(csvCell).join(',')).join('\r\n')}`;
    };

    const INVOICES_KEY = 'true_net_calculator_invoices_per_year';

    function ProviderSavings({ snapshot }) {
      const [perYear, setPerYear] = useState('12');
      const [ready, setReady] = useState(false);
      useEffect(() => {
        try {
          const n = Number(localStorage.getItem(INVOICES_KEY));
          if (Number.isInteger(n) && n >= 1 && n <= 1000) setPerYear(String(n));
        } catch {
          // Default of 12 invoices a year is used
        }
        setReady(true);
      }, []);
      useEffect(() => {
        if (!ready) return;
        try {
          localStorage.setItem(INVOICES_KEY, perYear);
        } catch {
          // Storage blocked
        }
      }, [perYear, ready]);

      const count = Math.min(1000, Math.max(1, Math.round(Number(perYear)) || 12));
      const rows = GATEWAY_KEYS.map((key) => {
        const c = calculatePayout({ gross: snapshot.gross, gateway: key, invoiceCurrency: snapshot.invoiceCurrency, targetCurrency: snapshot.targetCurrency, taxRate: snapshot.tax });
        return { key, name: c.gw.name, fees: c.fees.total, net: c.net, yearNet: roundCents(c.net * count) };
      });
      const best = rows.reduce((a, b) => (b.net > a.net ? b : a));
      const current = rows.find((r) => r.key === snapshot.gateway) || rows[0];
      const yearlySaving = roundCents(best.yearNet - current.yearNet);
      const hasInvoice = snapshot.gross > 0;

      return (
        <section aria-labelledby="savings-h" className={`${panel} p-5 lg:col-span-2`}>
          <h2 id="savings-h" className="text-base font-bold">Provider Savings and Annual Projection</h2>
          <p className="mb-4 text-xs text-slate-500">
            Uses the calculator's current invoice ({money(snapshot.gross, snapshot.invoiceCurrency)}, {snapshot.invoiceCurrency} to {snapshot.targetCurrency}, {snapshot.tax}% tax set-aside) and the same fee math, rounded to the cent at every step.
          </p>
          <div className="mb-4 max-w-xs">
            <label htmlFor="invoicesPerYear" className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Invoices per year</label>
            <input id="invoicesPerYear" className={field} type="number" inputMode="numeric" min="1" max="1000" step="1" value={perYear} onChange={(e) => setPerYear(e.target.value.slice(0, 4))} />
          </div>
          {!hasInvoice ? (
            <p className="rounded-lg border border-slate-200 bg-slate-50 p-3 text-xs text-slate-600">Enter an invoice amount in the calculator to compare providers.</p>
          ) : (
            <>
              <div className="overflow-x-auto rounded-lg border border-slate-200 bg-white">
                <table className="w-full min-w-[560px] text-left text-sm">
                  <caption className="sr-only">Fees and yearly take-home by payment provider</caption>
                  <thead className="border-b border-slate-200 bg-slate-50 text-xs font-bold uppercase text-slate-500">
                    <tr>
                      {['Provider', 'Fees per invoice', 'You keep per invoice', 'You keep per year', 'Versus best per year'].map((h) => (
                        <th key={h} scope="col" className="p-3">{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {rows.map((r) => (
                      <tr key={r.key} className={r.key === best.key ? 'bg-emerald-50' : ''}>
                        <th scope="row" className="p-3 font-bold">{r.name}{r.key === snapshot.gateway ? ' (selected)' : ''}</th>
                        <td className="p-3 font-mono tabular-nums">{money(r.fees, snapshot.invoiceCurrency)}</td>
                        <td className="p-3 font-mono tabular-nums">{money(r.net, snapshot.targetCurrency)}</td>
                        <td className="p-3 font-mono font-bold tabular-nums">{money(r.yearNet, snapshot.targetCurrency)}</td>
                        <td className="p-3 font-mono tabular-nums">{r.key === best.key ? 'Best' : `-${money(roundCents(best.yearNet - r.yearNet), snapshot.targetCurrency)}`}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <p role="status" className="mt-3 rounded-lg border border-emerald-200 bg-emerald-50 p-3 text-xs text-emerald-900">
                {yearlySaving > 0
                  ? `Switching from ${current.name} to ${best.name} would keep you about ${money(yearlySaving, snapshot.targetCurrency)} more per year at ${count} invoices of this size.`
                  : `${current.name} is already the best option for an invoice of this size.`}
              </p>
            </>
          )}
        </section>
      );

      const header = (

          <div className="grid grid-cols-1 gap-6 lg:grid-cols-2">
            <section aria-labelledby="profiles-h" className={`${panel} p-5`}>
              <h2 id="profiles-h" className="text-base font-bold">Saved Client Profiles</h2>
              <p className="mb-4 text-xs text-slate-500">Saves the calculator's current currencies, processor and tax rate. Use Edit to rename a profile and replace its settings with the calculator's current ones.</p>
              <div className="flex gap-2">
                <label htmlFor="profileName" className="sr-only">Profile name</label>
                <input id="profileName" className={field} value={profileName} maxLength={40} placeholder="e.g. Acme Corp EU" onChange={(e) => setProfileName(e.target.value)} />
                <button type="button" className={btnPrimary} onClick={saveProfile} disabled={!cleanText(profileName) || (!editingId && profiles.length >= MAX_PROFILES)}>{editingId ? 'Update' : 'Save'}</button>
                {editingId && (
                  <button type="button" className={btnQuiet} onClick={() => { setEditingId(null); setProfileName(''); }}>Cancel</button>
                )}
              </div>
              <ul className="mt-4 divide-y divide-slate-100">
                {profiles.length === 0 && <li className="py-3 text-xs text-slate-500">No profiles yet.</li>}
                {profiles.map((p) => (
                  <li key={p.id} className="flex items-center justify-between gap-3 py-3">
                    <div className="min-w-0">
                      <p className="truncate text-sm font-semibold">{p.name}</p>
                      <p className="text-xs text-slate-500">{p.invoiceCurrency} to {p.targetCurrency} · {GATEWAYS[p.gateway].name} · {p.tax}% tax</p>
                    </div>
                    <div className="flex shrink-0 gap-2">
                      <button type="button" className={btnQuiet} onClick={() => onLoadProfile(p)}>Load</button>
                      <button type="button" className={btnQuiet} onClick={() => { setEditingId(p.id); setProfileName(p.name); }} aria-label={`Edit ${p.name}`}>Edit</button>
                      <button type="button" className={btnQuiet} onClick={() => setProfiles(profiles.filter((x) => x.id !== p.id))} aria-label={`Delete ${p.name}`}>Delete</button>
                    </div>
                  </li>
                ))}
              </ul>
            </section>

            <section aria-labelledby="ledger-h" className={`${panel} p-5`}>
              <h2 id="ledger-h" className="text-base font-bold">Invoice Ledger</h2>
              <p className="mb-4 text-xs text-slate-500">Adds the calculator's current invoice to your private history. Every figure is recalculated with the same fee math.</p>
              <div className="flex gap-2">
                <label htmlFor="entryLabel" className="sr-only">Client or note</label>

                <button type="button" className={btnPrimary} onClick={addEntry} disabled={snapshot.gross <= 0 || ledger.length >= MAX_LEDGER}>Add</button>
              </div>
              <ul className="mt-4 max-h-72 divide-y divide-slate-100 overflow-y-auto">
                {ledger.length === 0 && <li className="py-3 text-xs text-slate-500">No entries yet.</li>}

                  <li key={e.id} className="flex items-center justify-between gap-3 py-3">
                    <div className="min-w-0">
                      <p className="truncate text-sm font-semibold">{e.label || 'Invoice'}</p>
                      <p className="text-xs text-slate-500">{e.date} · {money(e.gross, e.invoiceCurrency)} via {GATEWAYS[e.gateway].name}</p>
                    </div>
                    <div className="flex shrink-0 items-center gap-2">
                      <span className="text-sm font-semibold tabular-nums">{money(entryCalc(e).net, e.targetCurrency)}</span>
                      <button type="button" className={btnQuiet} onClick={() => setLedger(ledger.filter((x) => x.id !== e.id))} aria-label={`Delete ${e.label || 'entry'}`}>×</button>
                    </div>

              </ul>
              <div className="mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-4">
                <p className="text-xs text-slate-600">
                  {totals.length ? `Total kept: ${totals.map(([c, v]) => money(v, c)).join(' + ')}` : 'Total kept: none yet'}
                </p>
                <div className="flex gap-2">
                  <button type="button" className={btnQuiet} onClick={exportCsv} disabled={ledger.length === 0}>Download Accountant Report</button>
                  <button
                    type="button"
                    className={btnQuiet}
                    disabled={ledger.length === 0}
                    onClick={() => {
                      if (window.confirm('Delete every ledger entry on this device?')) setLedger([]);
                    }}
                  >
                    Clear all
                  </button>
                </div>
              </div>
            </section>

            <ProviderSavings snapshot={snapshot} />
            <FxTrend snapshot={snapshot} />
          </div>
        </main>
      );
    }

    const ALERT_KEY = 'true_net_calculator_fx_alert';

    function FxTrend({ snapshot }) {
      const [from, setFrom] = useState(snapshot.invoiceCurrency);
      const [to, setTo] = useState(snapshot.targetCurrency);
      const [threshold, setThreshold] = useState('1');
      const [ready, setReady] = useState(false);

      useEffect(() => {
        try {
          const t = Number(localStorage.getItem(ALERT_KEY));
          if (Number.isFinite(t) && t >= 0.1 && t <= 10) setThreshold(String(t));
        } catch {
          // Default threshold is used
        }
        setReady(true);
      }, []);
      useEffect(() => {
        if (!ready) return;
        try {
          localStorage.setItem(ALERT_KEY, threshold);
        } catch {
          // Storage blocked
        }
      }, [threshold, ready]);

      const limit = Math.min(10, Math.max(0.1, Number(threshold) || 1));
      const series = simulateFxSeries(from, to);
      const latest = series[series.length - 1];
      const avg = series.reduce((s, v) => s + v, 0) / series.length;
      const lo = Math.min(...series);
      const hi = Math.max(...series);
      const dev = avg > 0 ? ((latest - avg) / avg) * 100 : 0;
      const afterFees = calculatePayout({ gross: snapshot.gross, gateway: snapshot.gateway, invoiceCurrency: from, targetCurrency: to, taxRate: snapshot.tax }).fees.afterFees;
      const impact = roundCents(Math.abs(afterFees * (latest - avg)));
      const W = 600;
      const H = 200;
      const P = 16;
      const span = hi - lo || 1;
      const y = (v) => H - P - ((v - lo) / span) * (H - 2 * P);
      const pts = series.map((v, i) => `${(P + (i / (series.length - 1)) * (W - 2 * P)).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      const same = from === to;

      return (
        <section aria-labelledby="fx-h" className={`${panel} p-5 lg:col-span-2`}>
          <h2 id="fx-h" className="text-base font-bold">FX Trend Visualizer and Rate Alerts</h2>
          <p className="mb-4 text-xs text-slate-500">Simulated 30-day illustration. True Net Calculator uses fixed approximate rates and does not pull live market data, so treat alerts as a planning aid only.</p>
          <div className="grid grid-cols-1 gap-3 min-[480px]:grid-cols-3">
            <div className="min-w-0">
              <label htmlFor="fxFrom" className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">From</label>
              <select id="fxFrom" className={field} value={from} onChange={(e) => setFrom(toCurrency(e.target.value, 'USD'))}>
                {CURRENCIES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="min-w-0">
              <label htmlFor="fxTo" className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">To</label>
              <select id="fxTo" className={field} value={to} onChange={(e) => setTo(toCurrency(e.target.value, 'EUR'))}>
                {CURRENCIES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="min-w-0">
              <label htmlFor="fxLimit" className="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Alert threshold (%)</label>
              <input id="fxLimit" className={field} type="number" inputMode="decimal" min="0.1" max="10" step="0.1" value={threshold} onChange={(e) => setThreshold(e.target.value.slice(0, 5))} />
            </div>
          </div>
          {same ? (
            <p className="mt-4 rounded-lg border border-slate-200 bg-slate-50 p-3 text-xs text-slate-600">Pick two different currencies to see a trend.</p>
          ) : (
            <>
              <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label={`Simulated 30-day ${from} to ${to} rate. Today ${latest.toFixed(4)}, average ${avg.toFixed(4)}, low ${lo.toFixed(4)}, high ${hi.toFixed(4)}.`} className="mt-4 h-48 w-full rounded-lg border border-slate-200 bg-white">
                <line x1={P} x2={W - P} y1={y(avg)} y2={y(avg)} stroke="#94a3b8" strokeDasharray="5 5" />
                <polyline points={pts} fill="none" stroke="#0f172a" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
                <circle cx={W - P} cy={y(latest)} r="5" fill="#047857" />
                <text x={P} y={H - 2} fontSize="11" fill="#64748b">30 days ago</text>
                <text x={W - P} y={H - 2} fontSize="11" fill="#64748b" textAnchor="end">Today</text>
              </svg>
              <dl className="mt-3 grid grid-cols-2 gap-3 text-xs sm:grid-cols-4">
                {[['Today', latest], ['30-day average', avg], ['Low', lo], ['High', hi]].map(([k, v]) => (
                  <div key={k} className="rounded-lg border border-slate-200 bg-slate-50 p-3">
                    <dt className="text-[10px] uppercase text-slate-400">{k}</dt>
                    <dd className="font-mono text-sm font-bold text-slate-900">{v.toFixed(4)}</dd>
                  </div>
                ))}
              </dl>
              <p role="status" className={`mt-3 rounded-lg border p-3 text-xs ${Math.abs(dev) >= limit ? 'border-amber-200 bg-amber-50 text-amber-900' : 'border-slate-200 bg-slate-50 text-slate-600'}`}>
                {dev >= limit && `Rate alert: today's simulated rate is ${dev.toFixed(2)}% above its 30-day average. On your current ${money(snapshot.gross, from)} invoice, after fees, that is about ${money(impact, to)} more than the average rate would give.`}
                {dev <= -limit && `Rate alert: today's simulated rate is ${Math.abs(dev).toFixed(2)}% below its 30-day average, about ${money(impact, to)} less on your current ${money(snapshot.gross, from)} invoice after fees. Consider waiting or locking a rate with your provider.`}
                {Math.abs(dev) < limit && `No alert: today's simulated rate is ${dev.toFixed(2)}% from its 30-day average, inside your ${limit}% threshold.`}
              </p>
            </>
          )}
        </section>
      );
    }

    function LegalModal({ docKey, onClose }) {

      onCloseRef.current = onClose;

      useEffect(() => {
        const previous = document.activeElement;
        const previousOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        if (closeBtnRef.current) closeBtnRef.current.focus();
        const onKey = (e) => {
          if (e.key === 'Escape') {
            onCloseRef.current();
            return;
          }
          if (e.key !== 'Tab' || !dialogRef.current) return;
          const items = dialogRef.current.querySelectorAll('a[href], button:not([disabled])');
          if (!items.length) return;
          const first = items[0];
          const last = items[items.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        };
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('keydown', onKey);
          document.body.style.overflow = previousOverflow;
          if (previous && typeof previous.focus === 'function') previous.focus();
        };
      }, [docKey]);

      const closeLegal = () => {

        } catch {
          // Address bar not writable
        }
      };

      useEffect(() => {
        document.title = SITE_TITLE;
      }, []);

      useEffect(() => {
        try {
          const g = localStorage.getItem(STORAGE_KEYS.gross);
          const ic = localStorage.getItem(STORAGE_KEYS.invoiceCurrency);
          const tc = localStorage.getItem(STORAGE_KEYS.targetCurrency);
          const gw = localStorage.getItem(STORAGE_KEYS.gateway);
          const tx = localStorage.getItem(STORAGE_KEYS.tax);
          if (g !== null) setGrossAmount(g === '' ? '' : String(toAmount(g)));
          if (ic !== null) setInvoiceCurrency(toCurrency(ic, DEFAULTS.invoiceCurrency));
          if (tc !== null) setTargetCurrency(toCurrency(tc, DEFAULTS.targetCurrency));
          if (gw !== null) setGatewayKey(toGateway(gw));
          if (tx !== null) setTaxRate(toTaxRate(tx));
        } catch {
          // Storage blocked
        }
        setIsMounted(true);

        const stored = loadStoredLicense();
        if (stored) {
          setLicense(stored);
          validateLicense(stored).then((status) => {
            if (status === 'invalid') {
              clearStoredLicense();
              setLicense(null);
              setLicenseMsg('Your license is no longer valid, so premium modules are locked again.');
              setLicenseMsgError(true);
            }
          });
        }

        try {
          const { key: urlKey, search: cleaned } = takeLicenseKeyFromUrl(window.location.search);
          if (cleaned !== window.location.search) {
            window.history.replaceState(null, '', `${window.location.pathname}${cleaned}${window.location.hash}`);
          }
          if (urlKey && !(stored && stored.key === urlKey)) {
            setTab('v3');
            handleActivate(urlKey);
          }
        } catch {
          // Address bar not readable
        }
      }, []);

      useEffect(() => {
        if (!isMounted) return;
        try {
          localStorage.setItem(STORAGE_KEYS.gross, grossAmount);
          localStorage.setItem(STORAGE_KEYS.invoiceCurrency, invoiceCurrency);
          localStorage.setItem(STORAGE_KEYS.targetCurrency, targetCurrency);
          localStorage.setItem(STORAGE_KEYS.gateway, gatewayKey);
          localStorage.setItem(STORAGE_KEYS.tax, String(taxRate));
        } catch {
          // Storage quota
        }
      }, [grossAmount, invoiceCurrency, targetCurrency, gatewayKey, taxRate, isMounted]);

      const calc = calculatePayout({ gross: grossAmount, gateway: gatewayKey, invoiceCurrency, targetCurrency, taxRate });
      const { gw, isCross, fees, crossRate, converted, taxReserve, leakage, effectiveRate } = calc;
      const parsedGross = calc.amount;
      const safeTax = calc.tax;
      const trueNet = calc.net;

      const shownGross =
        grossFocused || grossAmount === ''
          ? grossAmount
          : parsedGross.toLocaleString('en-US', { maximumFractionDigits: 2 });

      const goTo = (id) => {
        setTab(id);
        if (typeof window !== 'undefined') window.scrollTo({ top: 0 });
      };
      const handleActivate = async (rawKey) => {
        setLicenseBusy(true);
        setLicenseMsg('');
        setLicenseMsgError(false);
        const result = await activateLicense(rawKey);
        if (result.ok) {
          saveStoredLicense(result.license);
          setLicense(result.license);
          setLicenseMsg('License activated. Premium modules are unlocked.');
        } else {
          setLicenseMsg(result.message);
          setLicenseMsgError(true);
        }
        setLicenseBusy(false);
      };

      const handleDeactivate = async () => {
        if (!license) return;
        setLicenseBusy(true);
        setLicenseMsgError(false);
        const freed = await deactivateLicense(license);
        clearStoredLicense();
        setLicense(null);
        setLicenseMsg(
